name: Build STAG Camera APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find STAG Camera ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: STAG Camera ZIP not found"
            exit 1
          fi
          echo "ZIP found: $ZIP"
          unzip -q "$ZIP" -d project

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project
        working-directory: project
        run: |
          gradle :app:tasks --stacktrace

      - name: Run Lint
        working-directory: project
        run: |
          gradle :app:lintDebug --stacktrace

      - name: Build APK
        working-directory: project
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STAG-Camera-APK
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            project/app/build/reports/
